<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- ── Viewport & Theme ── -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#C19A6B" />

    <!-- ── Favicon ── -->
    <link rel="icon" type="image/png" href="/logofav.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/logofav.png" />

    <!-- ── Primary SEO ── -->
    <title>Trylo Clothing — AI Virtual Try-On Fashion Store</title>
    <meta name="description" content="Trylo is Pakistan's first AI-powered virtual try-on fashion store. Shop premium clothing and see exactly how it looks on you — before you buy." />
    <meta name="keywords" content="Trylo, virtual try-on, AI fashion, online clothing store, Pakistan fashion, premium clothing, women fashion, AI try-on" />
    <meta name="author" content="Trylo Store" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://trylo.store/" />

    <!-- ── Open Graph (Facebook, WhatsApp, LinkedIn) ── -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Trylo Clothing" />
    <meta property="og:title" content="Trylo — AI Virtual Try-On Fashion Store" />
    <meta property="og:description" content="Pakistan's first AI-powered virtual try-on store. See premium clothing on yourself before you buy. Free nationwide delivery over Rs 15,000." />
    <meta property="og:image" content="https://trylo.store/logofav.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Trylo Clothing — AI Virtual Try-On" />
    <meta property="og:url" content="https://trylo.store/" />
    <meta property="og:locale" content="en_PK" />

    <!-- ── Twitter Card ── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@trylostore" />
    <meta name="twitter:title" content="Trylo — AI Virtual Try-On Fashion Store" />
    <meta name="twitter:description" content="Pakistan's first AI-powered virtual try-on store. See premium clothing on yourself before you buy." />
    <meta name="twitter:image" content="https://trylo.store/logofav.png" />

    <!-- ── Performance: Preload first hero video ── -->
    <link rel="preload" href="/videos/home1.mp4" as="video" type="video/mp4" />

    <!-- ── Google Fonts ── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
